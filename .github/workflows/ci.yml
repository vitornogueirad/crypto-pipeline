name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Testes unitários
        run: pytest tests/ -v

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init (batch)
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate (batch)
        run: terraform -chdir=infra validate

      - name: Terraform init (streaming)
        run: terraform -chdir=infra/streaming init -backend=false

      - name: Terraform validate (streaming)
        run: terraform -chdir=infra/streaming validate