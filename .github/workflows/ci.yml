name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Testes unitários
        run: pytest tests/ -v

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init (batch)
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate (batch)
        run: terraform -chdir=infra validate

      - name: Terraform init (streaming)
        run: terraform -chdir=infra/streaming init -backend=false

      - name: Terraform validate (streaming)
        run: terraform -chdir=infra/streaming validate

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install MkDocs Material and Dependencies
        run: |
          pip install mkdocs-material ghp-import
        
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-pages --force
